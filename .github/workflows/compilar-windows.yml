name: Compilar instalador de Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install --upgrade -r requirements-build.txt

      - name: Instalar Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Construir aplicación autónoma
        run: python -m PyInstaller --noconfirm --clean catalogador_pozos.spec

      - name: Compilar instalador
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\catalogador_pozos.iss'

      - name: Guardar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Catalogador-Pozos-Windows
          path: instalador_generado/*.exe

      - name: Publicar en GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: instalador_generado/*.exe
          generate_release_notes: true
